[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-security-scanner"
dynamic = ["version"]
description = "Defensive application security scanner for projects the operator owns."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "younes" }]
keywords = ["security", "static-analysis", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[project.urls]
Homepage = "https://github.com/yones1002/sentinel-security-scanner"
Repository = "https://github.com/yones1002/sentinel-security-scanner"
Documentation = "https://github.com/yones1002/sentinel-security-scanner/blob/develop/docs/sentinel-architecture.md"

[tool.setuptools.dynamic]
version = { attr = "sentinel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
