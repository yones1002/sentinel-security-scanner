name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Sentinel and test tools
        run: python -m pip install -e ".[dev]"
      - name: Check the installed entry points
        run: |
          test "$(sentinel version)" = "$(python -c 'import sentinel; print(sentinel.__version__)')"
          test "$(python -m sentinel version)" = "$(python -c 'import sentinel; print(sentinel.__version__)')"
      - name: Run Ruff
        run: python -m ruff check src tests
      - name: Run pytest
        run: python -m pytest
